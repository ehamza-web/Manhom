<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حائط التسجيل والدفع — صفحة الشخصية</title>
<style>
@font-face{font-family:'Dubai';font-weight:400;src:url(https://cdn.jsdelivr.net/npm/dubai-font@1.1.1/dubai-font/fonts/Dubai-Regular.woff2) format('woff2')}
@font-face{font-family:'Dubai';font-weight:700;src:url(https://cdn.jsdelivr.net/npm/dubai-font@1.1.1/dubai-font/fonts/Dubai-Bold.woff2) format('woff2')}
:root{--sky:#96E0FF;--blue:#3B5BDB;--blue-d:#2F49B5;--ink:#1a1a1a;--mut:#6b7280;--line:#e5e7eb;--gold:#F4C842;--navy:#0C1B3A}
*{box-sizing:border-box}body{margin:0;font-family:'Dubai',sans-serif;color:var(--ink);background:#f6f7fb;min-height:100vh;overflow:hidden}
a{color:var(--blue)}a:hover{color:var(--blue-d)}
header{height:72px;background:var(--sky);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:relative;z-index:1}
.logo{font-size:34px;font-weight:700;color:var(--blue);letter-spacing:-1px}.nav{display:flex;gap:28px;font-size:16px}.nav span{color:#1c2a4a}
.login{background:var(--blue);color:#fff;border-radius:10px;height:44px;padding:0 20px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.av{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:14px}
.profile{max-width:1000px;margin:0 auto;padding:32px 24px;display:grid;grid-template-columns:260px 1fr;gap:32px;filter:blur(3px);user-select:none}
.card{background:#fff;border-radius:16px;padding:24px;text-align:center}.ph{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;background:#c9d3ea center/cover}
.card h2{margin:0 0 6px;font-size:24px}.card p{margin:0;color:var(--mut);font-size:15px}
.main h1{font-size:28px;margin:0 0 16px}.ln{height:14px;border-radius:7px;background:#dfe3ee;margin-bottom:12px}
.box{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px}
.srch{background:var(--sky);padding:0 0 16px;position:relative;z-index:1}.srch div{max-width:1100px;margin:0 auto;height:64px;border-radius:100px;background:#fafafa;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 28px;color:#777;font-size:18px}.srch b{background:var(--blue);color:#fff;border-radius:100px;padding:10px 36px}.ov{position:fixed;inset:140px 0 0;background:rgba(25,25,25,.78);z-index:5}
.wall{position:fixed;bottom:0;right:0;left:0;z-index:6;background:#fff;min-height:58vh;max-height:94vh;overflow:visible;padding:26px 24px 22px;display:flex;align-items:center;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.in{max-width:700px;width:100%;margin:0 auto}
.tag{display:inline-flex;align-items:center;gap:8px;background:#FFF6DA;color:#7a5a00;border-radius:100px;padding:5px 14px;font-size:14px;font-weight:700;margin-bottom:12px}.tag i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.wall h3{font-size:26px;margin:0 0 6px;text-align:center}.sub{text-align:center;color:var(--mut);font-size:15px;margin:0 0 16px;line-height:1.6}.c{text-align:center}
.g{display:flex;align-items:center;justify-content:center;gap:12px;height:54px;border:1px solid var(--line);border-radius:12px;font-size:17px;background:#fff;width:100%;font-family:inherit;cursor:pointer}.g:hover{background:#f9fafb}
.or{display:flex;align-items:center;gap:16px;color:var(--mut);margin:8px 0}.lk{display:block;margin:12px auto 0;background:none;border:0;color:var(--blue);font:700 16px 'Dubai';cursor:pointer;text-decoration:underline}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-weight:700;font-size:15px;margin:0 0 8px}
input,select{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font:inherit;font-size:16px;background:#fff}input:focus,select:focus{outline:2px solid #b9c7fb;border-color:var(--blue)}input[readonly]{background:#f3f4f8;color:#555}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:700 18px 'Dubai';cursor:pointer;margin-top:12px}.btn:hover{background:var(--blue-d)}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.gold:hover{background:#E9B92E}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.btn.ghost:hover{background:#f0f3ff}
.fine{font-size:13px;color:var(--mut);margin:14px 0 0;text-align:center;line-height:1.7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fld{margin-bottom:10px}
.perks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;margin:0 0 20px;padding:0;list-style:none;font-size:15px}.perks li:before{content:"✓ ";color:var(--blue);font-weight:700}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 22px}.pk div{background:#f3f6ff;border-radius:12px;padding:12px 14px;text-align:right}.pk b{display:block;font-size:16px;margin-bottom:4px;color:var(--blue)}.pk span{font-size:14px;color:var(--mut);line-height:1.6}@media(max-width:700px){.pk{grid-template-columns:1fr}}.two{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center}.lockl{display:grid;gap:10px}.lockl div{display:flex;align-items:center;gap:12px;background:#f3f6ff;border-radius:12px;padding:12px 14px;color:var(--blue)}.lockl em{font-style:normal;color:var(--ink);font-size:15px;flex:1}.lockl i{height:10px;border-radius:5px;background:#cfd8f5;filter:blur(1px)}.lk2{width:60px;height:60px;border-radius:50%;background:#FFF6DA;color:#7a5a00;display:grid;place-items:center;margin:0 auto 12px}.lk2 svg{width:28px;height:28px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 18px}.steps div{display:flex;align-items:center;gap:10px;font-size:15px}.steps b{width:30px;height:30px;flex:none;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}@media(max-width:700px){.two,.steps{grid-template-columns:1fr}}.wall.adcw{border-top:5px solid #D5002B}.adc{display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:center;text-align:right}.adc small{color:#D5002B;font-weight:700;font-size:14px;letter-spacing:.5px}.adc h3{text-align:right;font-size:34px;line-height:1.3;margin:8px 0 12px;color:#2b2b2b}.adc p{color:#555;font-size:16px;line-height:1.8;margin:0 0 22px}.adc-b{display:inline-flex;align-items:center;gap:14px;height:56px;padding:0 28px;background:#D5002B;color:#fff;border-radius:4px;font-weight:700;font-size:17px;text-decoration:none}.adc-b:hover{background:#B30023;color:#fff}.adc-r{list-style:none;margin:0;padding:0;border-top:1px solid #e3e3e3}.adc-r li{display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid #e3e3e3}.adc-r b{font-size:22px;color:#D5002B;font-weight:400;width:34px}.adc-r strong{display:block;font-size:17px;color:#2b2b2b}.adc-r span{font-size:14px;color:#777}@media(max-width:700px){.adc{grid-template-columns:1fr;gap:20px}.adc h3{font-size:24px}}.md{position:fixed;inset:0;z-index:20;background:rgba(15,18,28,.6);display:none;align-items:center;justify-content:center;padding:16px}.md.on{display:flex}.mb{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:96vh;overflow:auto;padding:26px 28px 24px;position:relative}.mb h3{text-align:right;font-size:24px;margin:0 0 4px}.mb .sub{text-align:right;margin:0 0 18px}.mb{direction:ltr;scrollbar-width:thin;scrollbar-color:#c4c8d4 transparent}.mi{direction:rtl}.x{position:absolute;top:16px;left:16px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#6b7280;display:grid;place-items:center;cursor:pointer;transition:.15s}.x:hover{background:#f1f2f6;color:#111}.mb label{font-size:14px;margin-bottom:6px}.mb input{height:48px}.mb .fld{margin-bottom:12px}.mshr{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;margin:4px 0 6px}.mshr:has(input:checked){border-color:var(--blue);background:#f3f6ff}.mshr input{width:20px;height:20px;margin:3px 0 0;flex:none;accent-color:var(--blue)}.mshr b{display:block;font-size:15px;margin-bottom:2px}.mshr span{font-size:13.5px;color:var(--mut);line-height:1.6}.back{background:none;border:0;color:var(--blue);font:700 15px 'Dubai';cursor:pointer;margin-bottom:8px;padding:0}
.ok{text-align:center;padding:20px 0}.ok b{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#e6f7ee;color:#16a34a;font-size:32px;margin:0 auto 14px}
.sw{position:fixed;top:150px;left:16px;z-index:9;background:#fff;border-radius:12px;padding:6px;box-shadow:0 4px 18px rgba(0,0,0,.25);display:flex;gap:4px;flex-direction:column;font-size:14px}
.sw small{color:var(--mut);padding:2px 10px;font-size:12px}.sw button{border:0;background:none;font:700 14px 'Dubai';padding:9px 14px;border-radius:8px;cursor:pointer;text-align:right}.sw button.on{background:var(--blue);color:#fff}
@media(max-width:700px){.profile{grid-template-columns:1fr}.nav{display:none}.row{grid-template-columns:1fr}.wall h3{font-size:22px}}
</style></head><body>
<header><div class="logo">من هم</div><div class="nav"><span>أضف</span><span>عضويات</span><span>نشرة تعيينات السعودية</span><span>التصنيفات</span><span>القوائم</span></div><div class="login" id="hl">تسجيل الدخول</div></header><div class="srch"><div><span>ابحث ضمن 500,000 شخصية ومؤسسة</span><b>ابحث</b></div></div>
<div class="profile"><div class="card"><div class="ph"></div><h2>عبدالله الراشد</h2><p>الرئيس التنفيذي لمجموعة «الراشد القابضة»</p></div>
<div class="main"><h1>نبذة عن عبدالله الراشد</h1><div class="box"><div class="ln" style="width:95%"></div><div class="ln"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:90%"></div></div><div class="box"><div class="ln" style="width:40%"></div><div class="ln"></div><div class="ln" style="width:70%"></div></div></div></div>
<div class="sw"><small>معاينة الحائط</small><button id="b1" class="on" onclick="setS('reg')">حائط التسجيل (زائر)</button><button id="b2" onclick="setS('pay')">حائط الدفع (مسجّل)</button><div id="vs" style="display:none;flex-direction:column;gap:4px;border-top:1px solid #e5e7eb;margin-top:4px;padding-top:6px"><button onclick="setV(0)">تصميم 1 · مزايا</button><button onclick="setV(1)">تصميم 2 · معاينة المقفل</button><button onclick="setV(2)">تصميم 3 · خطوات</button><button onclick="setV(3)">تصميم 4 · مصرفي أحمر</button></div></div>
<div class="ov"></div>
<div class="wall"><div class="in" id="w"></div></div>
<div class="md" id="md"><div class="mb" id="mb"></div></div>
<script>
const CO='بنك الأفق',USER='sara@bankalufuq.com';
const G='<svg width="26" height="26" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.3-.4-4z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.700 16 19 13 24 13c3.100 0 5.800 1.200 8 3l5.700-5.700C34 6.100 29.300 4 24 4 16.300 4 9.700 8.300 6.300 14.700z"/><path fill="#4CAF50" d="M24 44c5.200 0 9.900-2 13.400-5.200l-6.200-5.200C29.200 35 26.700 36 24 36c-5.200 0-9.600-3.300-11.300-8l-6.500 5C9.500 39.600 16.200 44 24 44z"/><path fill="#1976D2" d="M43.600 20H24v8h11.300c-.8 2.200-2.200 4.200-4.100 5.600l6.200 5.200C37 39.200 44 34 44 24c0-1.300-.1-2.300-.4-4z"/></svg>';
let S='reg',V='main';
const form=(pre)=>`<button class="back" onclick="V='main';r()">← رجوع</button><h3>طلب اشتراك سنوي مفتوح</h3><p class="sub">اشتراك سنوي بلا حدود تصفح. سيتواصل معكم فريق من هم خلال يوم عمل.</p>
<form onsubmit="event.preventDefault();V='ok';r()"><div class="row"><div class="fld"><label>الاسم</label><input required placeholder="الاسم الكامل" ${pre?'value="سارة العلي"':''}></div><div class="fld"><label>البريد الإلكتروني للعمل</label><input required type="email" placeholder="name@company.com" ${pre?`value="${USER}" readonly`:''}></div></div>
<div class="row"><div class="fld"><label>رقم الجوال</label><input required placeholder="+966 5X XXX XXXX" dir="ltr" style="text-align:right"></div><div class="fld"><label>المسمى الوظيفي</label><input required placeholder="مثال: مديرة الاتصال المؤسسي"></div></div>
<div class="row"><div class="fld"><label>الجهة</label><input value="${CO}" readonly></div><div class="fld"><label>عدد المستخدمين المتوقع</label><select><option>1 – 10</option><option>11 – 50</option><option>51 – 200</option><option>أكثر من 200</option></select></div></div>
<button class="btn gold" type="submit">إرسال الطلب</button></form>`;
const ok=`<div class="ok"><b>✓</b><h3>وصل طلبك</h3><p class="sub">سيتواصل معكم فريق من هم قريباً لإتمام الاشتراك السنوي المفتوح.</p></div>`;
const reg=`<h3>انتهى رصيد الزوّار، سجّل الدخول لمواصلة التصفح مجاناً</h3><p class="sub">استنفدت الصفحات المتاحة للزوّار. أنشئ حساباً مجانياً أو سجّل الدخول لتحصل على رصيد إضافي، أو اطلب اشتراكاً سنوياً مفتوحاً.</p>
<button class="g">${G} المتابعة باستخدام جوجل</button><div class="or">أو</div><input type="email" placeholder="أدخل البريد الإلكتروني"><p class="fine" style="text-align:right;margin:8px 0 0">تسجيلك في من هم يعني أنك موافق على <a href="#">الشروط والأحكام</a>، و<a href="#">سياسة الخصوصية</a>.</p>
<button class="btn">التالي</button><button class="lk" onclick="openM()">اطلب اشتراكاً سنوياً مفتوحاً</button>`;
const payA=`<div class="c"><span class="tag"><i></i>انتهى رصيد حسابك المجاني</span></div><h3>تعرّف على من يصنعون القرار في المنطقة</h3><p class="sub">استنفدت الرصيد المتاح في حسابك المجاني. اشترك لتصل إلى الملفات الكاملة للشخصيات والشركات وكل محتوى من هم بلا حدود.</p><div class="pk"><div><b>ملفات كاملة</b><span>السيرة المهنية والمناصب الحالية والسابقة</span></div><div><b>علاقات ومجالس</b><span>شبكة الشخصية ومجالس الإدارة والعضويات</span></div><div><b>تعيينات وتحديثات</b><span>تابع أحدث التغييرات القيادية أولاً بأول</span></div></div><a class="btn gold" style="margin:0;text-decoration:none" href="Contact Subscription.html">تواصل معنا للحصول على اشتراك مفتوح</a><p class="fine">اشتراك سنوي مفتوح بلا حدود تصفح · نرد عليك خلال يوم عمل</p>`;
const lock='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>';
const payB=`<div class="two"><div><span class="tag"><i></i>انتهى رصيد حسابك المجاني</span><h3 style="text-align:right">الملف الكامل بانتظارك</h3><p class="sub" style="text-align:right">استنفدت الرصيد المتاح في حسابك المجاني. اشترك لتفتح كل ما هو مقفل، في الشخصيات والشركات وبقية محتوى من هم.</p><a class="btn gold" style="margin:0;text-decoration:none" href="Contact Subscription.html">تواصل معنا للحصول على اشتراك مفتوح</a><p class="fine" style="text-align:right">اشتراك سنوي مفتوح · بلا حدود تصفح</p></div><div class="lockl">${['المناصب الحالية والسابقة','مجالس الإدارة والعضويات','الخلفية التعليمية','شبكة العلاقات المهنية','الأخبار والتعيينات'].map((t,i)=>'<div><span>'+lock+'</span><em>'+t+'</em><i style="width:'+(70-i*8)+'px"></i></div>').join('')}</div></div>`;
const payC=`<div class="c"><div class="lk2">${lock}</div></div><h3>انتهى رصيد حسابك المجاني</h3><p class="sub">الاشتراك المفتوح يعيد لك الوصول الكامل للموقع. الخطوات بسيطة:</p><div class="steps"><div><b>1</b><span>تواصل معنا</span></div><div><b>2</b><span>نرد عليك خلال يوم عمل</span></div><div><b>3</b><span>يُفعَّل اشتراكك السنوي</span></div></div><a class="btn gold" style="margin:0;text-decoration:none" href="Contact Subscription.html">تواصل معنا للحصول على اشتراك مفتوح</a>`;
const payD=`<div class="adc"><div class="adc-l"><small>عضوية من هم</small><h3>افتح الملف الكامل، بلا حدود</h3><p>انتهى رصيد حسابك المجاني. اشتراك سنوي مفتوح يمنحك وصولاً كاملاً إلى الشخصيات والشركات وكل محتوى من هم.</p><a class="adc-b" href="Contact Subscription.html">تواصل معنا للحصول على اشتراك مفتوح<span>←</span></a></div><ul class="adc-r"><li><b>01</b><div><strong>ملفات كاملة</strong><span>المناصب والسيرة والتعليم</span></div></li><li><b>02</b><div><strong>شبكة العلاقات</strong><span>مجالس الإدارة والعضويات</span></div></li><li><b>03</b><div><strong>تعيينات وأخبار</strong><span>تغييرات القيادات أولاً بأول</span></div></li></ul></div>`;
const PAYS=[payA,payB,payC,payD];let PV=0;
