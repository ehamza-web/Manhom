  <section style={{ minHeight: 600, background: '#FDFDFD', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 40 }}>
      <div style={{ maxWidth: 440, background: 'white', borderRadius: 32, boxShadow: '0 20px 60px rgba(0,0,0,0.10)', padding: '48px 40px', textAlign: 'center' }}>
        <div style={{ width: 96, height: 96, background: '#f0fdf4', borderRadius: 24, display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 32px', transform: 'rotate(3deg)' }}>
          <Icon name="check" size={48} color="#16a34a" stroke={2} />
        </div>
        <h2 style={{ fontSize: 32, fontWeight: 800, color: '#0f172a', marginBottom: 14 }}>{T.successTitle}</h2>
        <p style={{ fontSize: 16, color: '#64748b', lineHeight: 1.8, marginBottom: 32 }}>{T.successA}{successDay}.</p>
        <button onClick={() => setView('landing')} style={{ borderRadius: 100, padding: '14px 40px', fontWeight: 700, background: '#0f172a', color: 'white', border: 0, fontSize: 16, cursor: 'pointer', fontFamily: 'inherit' }}>{T.home}</button>
      </div>
    </section>;

  return (
    <Page dir={isEN ? 'ltr' : 'rtl'}>
      <Header lang={lang} />
      {view === 'landing' && <Landing />}
      {view === 'subscribe' && <Subscribe />}
      {view === 'success' && <Success />}
      <Footer lang={lang} />
    </Page>);

};

// ═══════════════════ MAWSHOOR SCREEN — UAE ═══════════════════
const ScreenMawshoorUAE = ({ onNav }) => <ScreenMawshoor onNav={onNav} region="ae" />;
const ScreenMawshoorUAEEn = ({ onNav }) => <ScreenMawshoor onNav={onNav} region="ae" lang="en" />;


const LEADER_MODE = false;
const App = () => { const [lang, setLang] = useState(() => location.hash === '#en' ? 'en' : 'ar');
  const onNav = (k) => { if (k === 'mawshoor-ae-en') { setLang('en'); location.hash = 'en'; window.scrollTo(0, 0); } else if (k === 'mawshoor-ae') { setLang('ar'); location.hash = ''; window.scrollTo(0, 0); } else location.href = 'manhom-flow.html'; };
  return <ScreenMawshoor onNav={onNav} region="sa" lang="ar" />; };
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
