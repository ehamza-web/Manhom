<PromoFrame v={pv} p={pp} c={pcol}><h3 id="lp-arts" style={bar}>مقالات تهمك</h3>
          <div style={grid(260)}>{arts.map((a) => <a key={a.i} href="#" onClick={(e) => e.preventDefault()} style={{ display: 'flex', gap: 12, alignItems: 'center', background: 'white', border: '1px solid #f1f5f9', borderRadius: 12, padding: 10, textDecoration: 'none' }}>

            <img src={'https://picsum.photos/seed/' + a.i + '/250/170'} alt="" style={{ width: 92, height: 64, borderRadius: 6, objectFit: 'cover', flexShrink: 0 }} />
          </a>)}</div>
        </PromoFrame>

      <div style={{ position: 'fixed', bottom: 16, left: '50%', transform: 'translateX(-50%)', zIndex: 80, background: '#1e1b2e', color: 'white', borderRadius: 20, padding: '10px 14px', display: 'grid', gap: 4, boxShadow: '0 8px 28px rgba(0,0,0,.28)', maxWidth: '94vw' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexWrap: 'wrap', justifyContent: 'center' }}><span style={{ fontSize: 12, opacity: .7, marginInlineEnd: 4 }}>النمط:</span>{[['a', 'شريط علوي ★'], ['b', 'إطار منقّط'], ['c', 'فاصل'], ['d', 'خطوط قطرية'], ['e', 'بطاقة هادئة'], ['f', 'ترويسة مدمجة'], ['off', 'بدون']].map(([k, l]) => <button key={k} onClick={() => setPv(k)} style={{ border: 0, borderRadius: 100, padding: '6px 13px', fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', background: pv === k ? '#B9A3EC' : 'transparent', color: pv === k ? '#1e1b2e' : 'white' }}>{l}</button>)}</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexWrap: 'wrap', justifyContent: 'center' }}><span style={{ fontSize: 12, opacity: .7, marginInlineEnd: 4 }}>العبارة:</span>{PROMO_P.map((x) => [x.k, x.n]).map(([k, l]) => <button key={k} onClick={() => setPp(k)} style={{ border: 0, borderRadius: 100, padding: '6px 13px', fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', background: pp === k ? '#B9A3EC' : 'transparent', color: pp === k ? '#1e1b2e' : 'white' }}>{l}</button>)}</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', justifyContent: 'center' }}><span style={{ fontSize: 12, opacity: .7, marginInlineEnd: 4 }}>اللون:</span>{Object.entries(PROMO_C).map(([k, x]) => <button key={k} onClick={() => setPcol(k)} style={{ border: pcol === k ? '2px solid white' : '2px solid transparent', borderRadius: 100, padding: '4px 12px 4px 6px', fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', background: 'transparent', color: 'white', display: 'inline-flex', alignItems: 'center', gap: 6 }}><span style={{ width: 16, height: 16, borderRadius: '50%', background: x.ink, boxShadow: 'inset 0 0 0 4px ' + x.tint }} />{x.n}</button>)}</div>

};

// ═══════════════════ PROMO FRAME ═══════════════════
const PROMO_P = [
  { k: 'p1', n: 'مميّز ★', tag: 'مميّز', foot: 'تابع تصفح الملف' },
  { k: 'p2', n: 'مقترح لك', tag: 'مقترح لك', foot: 'عُد إلى الملف الشخصي' },
  { k: 'p3', n: 'من شركائنا', tag: 'من شركائنا', foot: 'نواصل الملف من هنا' },
  { k: 'p4', n: 'مساحة مميّزة', tag: 'مساحة مميّزة', foot: 'تابع القراءة بعد هذه المساحة' },
  { k: 'p5', n: 'للاستكشاف', tag: 'للاستكشاف', foot: 'ننتقل الآن إلى بقية الملف' }
];
const PROMO_C = {
  violet: { n: 'بنفسجي', ink: '#5B3FB0', line: '#CDBDF2', tint: '#F4EFFF', tint2: '#EDE5FF', mid: '#B9A3EC' },
  green: { n: 'أخضر', ink: '#166534', line: '#B7DEC4', tint: '#EFFAF2', tint2: '#DDF3E5', mid: '#7CC796' },
  orange: { n: 'برتقالي', ink: '#B23A0A', line: '#F6C6A3', tint: '#FFF4EA', tint2: '#FFE6D2', mid: '#F2A365' },
  yellow: { n: 'أصفر', ink: '#7A5700', line: '#E9D58A', tint: '#FFFAE0', tint2: '#FFF0B3', mid: '#E2C03F' }
};
const PromoFrame = ({ v, p, c: pc, children }) => {
  if (v === 'off') return <section style={{ marginBottom: 34 }}>{children}</section>;
  const t = PROMO_P.find((x) => x.k === p) || PROMO_P[0];
  const { ink, line, tint, tint2, mid } = PROMO_C[pc] || PROMO_C.violet;
  const foot = (extra) => <div style={{ display: 'flex', alignItems: 'center', gap: 8, justifyContent: 'center', marginTop: 16, fontSize: 13, fontWeight: 600, color: ink, ...extra }}><span>{t.foot}</span><span style={{ fontSize: 15 }}>↓</span></div>;
  const pill = () => <span style={{ position: 'absolute', top: -13, insetInlineStart: 18, background: ink, color: 'white', fontSize: 12.5, fontWeight: 700, borderRadius: 100, padding: '4px 14px', whiteSpace: 'nowrap', lineHeight: 1.4, width: 'max-content' }}>{t.tag}</span>;
  const dot = <span style={{ width: 7, height: 7, borderRadius: '50%', background: ink, display: 'inline-block' }} />;
  const rule = <span style={{ flex: 1, height: 1, background: line }} />;
  if (v === 'a') return <section style={{ marginBottom: 34, borderRadius: 16, overflow: 'hidden', border: '1px solid ' + line, background: tint }}>
    <div style={{ background: ink, color: 'white', padding: '8px 18px', fontSize: 13, fontWeight: 700 }}>{t.tag}</div>
    <div style={{ padding: 18 }}>{children}{foot()}</div></section>;
  if (v === 'b') return <section style={{ marginBottom: 34, position: 'relative', marginTop: 8 }}>
    <div style={{ background: tint, border: '2px dashed ' + mid, borderRadius: 16, padding: '26px 18px 18px' }}>{children}{foot({ borderTop: '1px dashed ' + mid, paddingTop: 14 })}</div>{pill()}</section>;
  if (v === 'c') return <section style={{ marginBottom: 34 }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10, color: ink, fontSize: 12.5, fontWeight: 700 }}>{rule}<span>{t.tag}</span>{rule}</div>
    <div style={{ background: tint, borderRadius: 16, padding: 18 }}>{children}</div>
    <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginTop: 10, color: ink, fontSize: 13, fontWeight: 600 }}>{rule}<span>{t.foot} ↓</span>{rule}</div></section>;
  if (v === 'd') return <section style={{ marginBottom: 34, position: 'relative', marginTop: 8 }}>
    <div style={{ background: 'repeating-linear-gradient(135deg,' + tint + ' 0 14px,' + tint2 + ' 14px 28px)', borderRadius: 16, padding: '26px 18px 18px', borderInlineStart: '6px solid ' + ink }}>{children}{foot()}</div>{pill()}</section>;
  if (v === 'e') return <section style={{ marginBottom: 34, background: tint, borderRadius: 18, padding: '14px 18px 16px' }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: ink, fontSize: 13, fontWeight: 700, marginBottom: 12 }}>{dot}{t.tag}</div>
    {children}{foot({ marginTop: 14 })}</section>;
  return <section style={{ marginBottom: 34, background: 'linear-gradient(180deg,' + tint2 + ',' + tint + ' 90px)', borderRadius: 18, border: '1px solid ' + line, padding: '12px 18px 16px' }}>
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}><span style={{ color: ink, fontSize: 13, fontWeight: 700 }}>{t.tag}</span>{rule}<span style={{ color: ink, fontSize: 12, opacity: .85 }}>{t.foot} ↓</span></div>
    {children}</section>;
};
// ═══════════════════ PROFILE EXTRA SECTIONS ═══════════════════
const PfLists = ({ bar }) => <section style={{ marginBottom: 28 }}>
  <h3 style={bar}>قوائم من هم</h3>
  <a href="#" onClick={(e) => e.preventDefault()} style={{ display: 'block', maxWidth: 240, border: '1px solid #f1f5f9', borderRadius: 14, padding: 10, textDecoration: 'none' }}>
    <div style={{ background: '#FDEB85', borderRadius: 4, height: 124, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 44, fontWeight: 800, color: '#C9A227' }}>من هم</div>
    <div style={{ fontSize: 14.5, color: '#20211F', marginTop: 12, padding: '0 4px 4px' }}>من هم الرؤساء التنفيذيون في الإمارات</div>
  </a>
</section>;
const PfGallery = ({ bar }) => {
  const [n, setN] = useState(0);
  const imgs = ['gal1', 'gal2', 'gal3', 'gal4', 'gal5', 'gal6'];
  const nb = { width: 38, height: 38, borderRadius: '50%', border: '1px solid #e2e8f0', background: 'white', cursor: 'pointer', fontSize: 18, color: '#1e293b' };
  return <section style={{ marginBottom: 28 }}>
    <h3 style={bar}>معرض مسعود شريف</h3>
    <div style={{ background: '#F0F0F0', borderRadius: 10, padding: '10px 18px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, marginBottom: 14 }}>
      <b style={{ fontSize: 18, color: '#1e293b' }}>صور</b>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
        <button onClick={() => setN(Math.max(0, n - 1))} style={nb}>›</button>
        <button onClick={() => setN(Math.min(imgs.length - 2, n + 1))} style={nb}>‹</button>
        <button style={{ background: 'white', border: '1px solid #dbe3f5', color: '#4169E1', borderRadius: 100, padding: '8px 18px', fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>عرض المزيد</button>
      </div>
    </div>
    <div style={{ overflow: 'hidden', borderRadius: 10 }}>
      <div style={{ display: 'flex', gap: 12, transform: 'translateX(' + n * 232 + 'px)', transition: 'transform .3s' }}>
        {imgs.map((s) => <img key={s} src={'https://picsum.photos/seed/' + s + '/460/330'} alt="" style={{ width: 220, height: 160, borderRadius: 8, objectFit: 'cover', flexShrink: 0, background: '#eee' }} />)}
      </div>
    </div>
  </section>;
};
const PfEduAwards = ({ sub }) => {
  const row = (t, s, d) => <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start', marginBottom: 20 }}>
    <div style={{ width: 64, height: 64, borderRadius: 12, border: '1px solid #e2e8f0', background: '#FBF8F0', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}><Icon name="briefcase" size={26} color="#C9A86A" /></div>
    <div style={{ minWidth: 0 }}><div style={{ fontSize: 16, fontWeight: 700, color: '#1e293b', marginBottom: 4 }}>{t}</div><a href="#" onClick={(e) => e.preventDefault()} style={{ color: '#4169E1', fontSize: 15, textDecoration: 'none' }}>{s}</a><div style={{ fontSize: 13, color: '#64748b', marginTop: 4 }}>{d}</div></div>
  </div>;
  return <>
    <div style={sub}>التعليم</div>
    {row('ماجستير في إدارة الأعمال تخصص مالية', 'جامعة ماكغيل', '2005')}
    {row('بكالوريوس في هندسة أنظمة الحاسب الآلي', 'جامعة بوسطن', '2000')}
    <div style={sub}>الجوائز</div>
    {row('جائزة التميز في القيادة الرقمية', 'القمة العالمية للحكومات', '2025')}
  </>;
};
const PfRelatives = ({ bar, onNav }) => {
  const rel = [{ n: 'أيمن شريف', r: 'أخ', p: 'https://i.pravatar.cc/300?img=12' }, { n: 'ضيا شريف', r: 'أخت', p: 'https://i.pravatar.cc/300?img=45' }, { n: 'أمير شريف', r: 'ابن عم/خال', p: 'https://i.pravatar.cc/300?img=33', v: true }];
  return <section style={{ marginBottom: 28 }}>
    <h3 style={bar}>أقارب مسعود شريف</h3>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,130px)', gap: 16 }}>
      {rel.map((x) => <a key={x.n} href="#" onClick={(e) => {e.preventDefault();onNav('profile');}} style={{ textDecoration: 'none', textAlign: 'right' }}>
        <img src={x.p} alt={x.n} style={{ width: '100%', aspectRatio: '1/1.15', objectFit: 'cover', borderRadius: 12, filter: 'grayscale(1)', display: 'block' }} />
        <div style={{ fontSize: 15, fontWeight: 800, color: '#1e293b', margin: '8px 0 2px', display: 'flex', alignItems: 'center', gap: 5 }}>{x.n} {x.v && <VerifiedBadge type="blue" size={14} />}</div>
        <div style={{ fontSize: 13, color: '#64748b' }}>{x.r}</div>
      </a>)}
    </div>
  </section>;
};

// ═══════════════════ APP ═══════════════════
const App = () => {
  const [mode, setMode] = useState('flow');
  const [current, setCurrent] = useState('home');
  const [personId, setPersonId] = useState(null);
  const [plan, setPlan] = useState(null);

  const onNav = (screen, extra) => {
    setCurrent(screen);
    if (screen === 'profile' && extra) setPersonId(extra);
    if ((screen === 'checkout' || screen === 'verify') && extra) setPlan(extra);
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  const screenMap = {
    home: <ScreenHome onNav={onNav} />,
    search: <ScreenSearch onNav={onNav} />,
    categories: <ScreenCategories onNav={onNav} />,
    lists: <ScreenLists onNav={onNav} />,
    profile: <ScreenProfile onNav={onNav} personId={personId || 'masoud'} />,
    'profile-linear': <ScreenProfileLinear onNav={onNav} personId={personId || 'masoud'} />,
    tait: <ScreenTait onNav={onNav} />,
    company: <ScreenCompany onNav={onNav} />,
    mawshoor: <ScreenMawshoor onNav={onNav} />,
    'mawshoor-ae': <ScreenMawshoorUAE onNav={onNav} />,
    'mawshoor-ae-en': <ScreenMawshoorUAEEn onNav={onNav} />,
    'mawshoor-list': <ScreenMawshoorList onNav={onNav} />,
    'mawshoor-list-en': <ScreenMawshoorList onNav={onNav} initialLang="en" key="mlist-en" />,
    add: <ScreenAdd onNav={onNav} />,
    nominate: <ScreenNominate onNav={onNav} />,
    membership: <ScreenMembership onNav={onNav} />,
    checkout: <ScreenCheckout onNav={onNav} plan={plan} />,
    verify: <ScreenVerify onNav={onNav} plan={plan} />,
    legacy: <ScreenLegacyIndex onNav={onNav} />,
    'legacy-profile': <ScreenLegacy onNav={onNav} />
  };

  return (
    <>
      {screenMap[current] || screenMap.home}
    </>);

};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);


</script>
</body>
